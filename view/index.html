<!DOCTYPE html>
<html>

<head>
    <title>Available Chains</title>
    <script src="https://cdn.jsdelivr.net/npm/jsoneditor@9.10.0/dist/jsoneditor.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/jsoneditor@9.10.0/dist/jsoneditor.min.css" rel="stylesheet">
    <style>
        #jsoneditor {
            width: 100%;
            height: 400px;
            margin-top: 20px;
        }

        select {
            margin: 10px 0;
            padding: 5px;
        }
    </style>
</head>

<body>
    <h1>Available Chains</h1>
    <p>Select a chain to view its JSON data:</p>

    <!-- Placeholder for the dropdown options -->
    <select id="chainDropdown">
        <!-- This placeholder will be replaced with real options -->
        {{CHAIN_OPTIONS_PLACEHOLDER}}
    </select>

    <h2>JSON Viewer</h2>
    <div id="jsoneditor"></div>

    <script>
        const container = document.getElementById("jsoneditor");
        const editor = new JSONEditor(container);

        const dropdown = document.getElementById("chainDropdown");

        // Load JSON for the selected chain
        function loadSelectedChain() {
            const selectedValue = dropdown.value;
            if (!selectedValue) {
                alert("Please select a chain.");
                return;
            }

            fetch(selectedValue)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`Failed to fetch ${selectedValue}: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    editor.set(data);
                })
                .catch(error => {
                    console.error(error);
                    editor.set({ error: error.message });
                });
        }

        // Add change event listener to the dropdown
        dropdown.addEventListener("change", loadSelectedChain);
    </script>
</body>

</html>
